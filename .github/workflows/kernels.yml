name: UFlinux kernels

on:
  pull_request:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      generate_release_profiles:
        description: Generate profiles for generic and virtual x86_64 and AArch64 kernels
        type: boolean
        default: false
      profile_target:
        description: Optional target for a profiling build without publication
        type: choice
        default: none
        options:
          - none
          - x86_64
          - aarch64
          - virt-x86_64
          - virt-aarch64
          - orangepi-rv2
          - dragon-q6a
          - rpi

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      profile_matrix: ${{ steps.sources.outputs.profile_matrix }}
      bolt_matrix: ${{ steps.sources.outputs.bolt_matrix }}
      fingerprint: ${{ steps.sources.outputs.fingerprint }}
      build: ${{ steps.sources.outputs.build }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_TARGET: ${{ inputs.profile_target || 'none' }}
          GENERATE_PROFILES: ${{ inputs.generate_release_profiles }}
          ARM_BOLT: ${{ vars.KERNEL_AARCH64_BOLT_RUNNER }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GENERATE_PROFILES" == true && ( "$PROFILE_TARGET" != none || "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ) ]]; then
            echo "::error::Profile generation requires a full release build on the default branch"
            exit 1
          fi
          args=()
          [[ "$PROFILE_TARGET" == none ]] || args+=(--target "$PROFILE_TARGET")
          [[ "$GENERATE_PROFILES" != true ]] || args+=(--generate-profiles)
          python3 scripts/resolve.py "${args[@]}"
          matrix=$(jq -c '{include:[.targets|to_entries[]|{
            target:.key,runner:.value.runner,builder:.value.builder,
            profile:(.value.source == "stable" and (.value.apk == "x86_64" or .value.apk == "aarch64"))
          }]}' work/resolved.json)
          profile_matrix=$(jq -c '{include:[.include[]|select(.profile)]}' <<< "$matrix")
          bolt_matrix=$(jq -c --arg arm "$ARM_BOLT" '{include:[.include[]|select(.builder == "x86_64" or $arm != "")]}' <<< "$profile_matrix")
          source_hash=$(jq -r .fingerprint work/resolved.json)
          recipe_hash=$(git ls-tree -r HEAD -- scripts patches profiles targets.json .github/workflows/kernels.yml | sha256sum | cut -d' ' -f1)
          fingerprint=$(printf '%s\n%s\n' "$source_hash" "$recipe_hash" | sha256sum | cut -d' ' -f1)
          tag="kernels-${fingerprint:0:24}"
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] && gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false; then
            build=false
          fi
          printf 'matrix=%s\nprofile_matrix=%s\nbolt_matrix=%s\nfingerprint=%s\nbuild=%s\n' "$matrix" "$profile_matrix" "$bolt_matrix" "$fingerprint" "$build" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: resolved-inputs
          path: work/resolved.json
          if-no-files-found: error
          overwrite: true

  kernel-builders:
    needs: resolve
    if: needs.resolve.outputs.build == 'true' && inputs.generate_release_profiles
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-inputs
          path: work
      - name: Snapshot Alpine kernel build dependencies
        env:
          BUILDER_ARCH: ${{ matrix.arch }}
        run: |
          source scripts/container.sh
          fetch_kernel_packages work/resolved.json "$BUILDER_ARCH" work/kernel-packages
      - uses: actions/upload-artifact@v7
        with:
          name: alpine-build-deps-${{ matrix.arch }}
          path: work/kernel-packages/*.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  bolt-tool:
    needs: resolve
    if: needs.resolve.outputs.build == 'true' && inputs.generate_release_profiles
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-inputs
          path: work
      - name: Install pinned LLVM tools
        env:
          BUILDER_ARCH: x86_64
        run: |
          major=$(jq -er '.llvm.major' work/resolved.json)
          packages=(cmake ninja-build g++ libzstd-dev zlib1g-dev)
          codename=$(jq -er '.llvm.apt_codename' work/resolved.json)
          test "$codename" = "$(. /etc/os-release && echo "$VERSION_CODENAME")"
          llvm_pins=$(jq -er --arg arch "$BUILDER_ARCH" '
            .llvm.apt_packages[$arch] | to_entries[] | "\(.key)=\(.value)"
          ' work/resolved.json)
          mapfile -t llvm_packages <<< "$llvm_pins"
          curl -fsSL --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key |
              sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/$codename llvm-toolchain-$codename-$major main" |
              sudo tee "/etc/apt/sources.list.d/llvm-$major.list" > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}" "${llvm_packages[@]}"
      - name: Build and bundle the x86 kernel rewriter
        run: |
          scripts/build-kernel-bolt.sh work/kernel-bolt work/resolved.json
          UFLINUX_BOLT_BINARY="$PWD/work/kernel-bolt/llvm-bolt" \
            scripts/prepare-bolt.sh x86_64 work/bolt-tool --bundle
          tar -C work/bolt-tool -cf work/bolt-tool.tar bolt
      - uses: actions/upload-artifact@v7
        with:
          name: bolt-tool-x86
          path: work/bolt-tool.tar
          if-no-files-found: error
          overwrite: true

  profile-compile:
    needs: [resolve, kernel-builders]
    if: needs.resolve.outputs.build == 'true' && inputs.generate_release_profiles
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.profile_matrix) }}
    runs-on: ${{ matrix.builder == 'aarch64' && vars.KERNEL_AARCH64_BUILD_RUNNER || matrix.runner }}
    timeout-minutes: 330
    env:
      TARGET: ${{ matrix.target }}
      UFLINUX_KERNEL_PACKAGES: work/kernel-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-inputs
          path: work
      - uses: actions/download-artifact@v8
        with:
          name: alpine-build-deps-${{ matrix.builder }}
          path: work/kernel-packages
      - name: Compile collection kernel
        run: |
          export UFLINUX_KERNEL_PHASE=compile
          time scripts/container.sh "$TARGET" work/resolved.json "work/$TARGET" --profile-build
          time tar -C "work/$TARGET" -I 'zstd -T2 -3' -cf work/collection.tar.zst \
            stage kernel.config build.json vmlinux
      - uses: actions/upload-artifact@v7
        with:
          name: collection-${{ matrix.target }}
          path: work/collection.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  profile-collect:
    needs: [resolve, kernel-builders, profile-compile]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.profile_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      UFLINUX_KERNEL_PACKAGES: work/kernel-packages
      UFLINUX_PKGREL: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-inputs
          path: work
      - name: Install emulators
        run: scripts/install-emulators.sh "$TARGET"
      - uses: actions/download-artifact@v8
        with:
          name: alpine-build-deps-${{ matrix.builder }}
          path: work/kernel-packages
      - uses: actions/download-artifact@v8
        with:
          name: collection-${{ matrix.target }}
          path: work
      - name: Train collection kernel
        run: |
          mkdir -p "work/$TARGET"
          tar -xf work/collection.tar.zst -C "work/$TARGET"
          UFLINUX_KERNEL_PHASE=package UFLINUX_PROFILE_GUEST=1 \
            scripts/container.sh "$TARGET" work/resolved.json "work/$TARGET"
          time scripts/collect-release-profiles.sh work/resolved.json "work/$TARGET/profiles" "$TARGET" pgo "work/$TARGET"
          time env UFLINUX_KERNEL_PHASE=merge-pgo scripts/container.sh "$TARGET" work/resolved.json "work/$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-profile-${{ matrix.target }}
          path: work/${{ matrix.target }}/profiles
          if-no-files-found: error
          overwrite: true

  compile:
    needs: [resolve, kernel-builders, profile-collect]
    if: ${{ !cancelled() && needs.resolve.outputs.build == 'true' && (needs.profile-collect.result == 'success' || (!inputs.generate_release_profiles && needs.profile-collect.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: >-
      ${{ matrix.runner == 'ubuntu-26.04-arm'
          && github.event_name != 'pull_request'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && vars.KERNEL_AARCH64_BUILD_RUNNER || matrix.runner }}
    timeout-minutes: 330
    env:
      TARGET: ${{ matrix.target }}
      PROFILE_TARGET: ${{ inputs.profile_target || 'none' }}
      REQUIRE_PROFILE: ${{ matrix.profile && inputs.generate_release_profiles }}
      BOLT_RELEASE: ${{ matrix.profile && inputs.generate_release_profiles && (matrix.builder == 'x86_64' || vars.KERNEL_AARCH64_BOLT_RUNNER != '') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-inputs
          path: work
      - uses: actions/download-artifact@v8
        if: inputs.generate_release_profiles
        with:
          name: alpine-build-deps-${{ matrix.builder }}
          path: work/kernel-packages
      - uses: actions/download-artifact@v8
        if: env.REQUIRE_PROFILE == 'true'
        with:
          name: compiler-profile-${{ matrix.target }}
          path: work/${{ matrix.target }}/profiles
      - name: Compile and stage kernel
        run: |
          args=()
          [[ ! -d work/kernel-packages ]] || export UFLINUX_KERNEL_PACKAGES=work/kernel-packages
          if [[ "$PROFILE_TARGET" != none ]]; then
            args+=(--profile-build)
          elif [[ "$BOLT_RELEASE" == true ]]; then
            args+=(--bolt-baseline)
          elif [[ "$REQUIRE_PROFILE" == true ]]; then
            args+=(--pgo-build)
          fi
          if [[ "$REQUIRE_PROFILE" != true ]]; then
            if ! scripts/prepare-bolt.sh "$TARGET" "work/$TARGET"; then
              rm -f "work/$TARGET/bolt/llvm-bolt"
              echo "::warning::BOLT tool unavailable for $TARGET"
            fi
          fi
          export UFLINUX_KERNEL_PHASE=compile
          time scripts/container.sh "$TARGET" work/resolved.json "work/$TARGET" "${args[@]}"
          if [[ "$REQUIRE_PROFILE" == true ]]; then
            jq -e '.pgo == true' "work/$TARGET/build.json"
          fi
          files=(stage kernel.config build.json "source-$TARGET.tar.zst")
          if [[ "$BOLT_RELEASE" == true ]]; then
            files=(stage kernel.config build.json kernel obj profiles vmlinux)
          elif [[ "$PROFILE_TARGET" != none ]]; then
            files+=(vmlinux)
          fi
          time tar --format=posix -C "work/$TARGET" -I 'zstd -T2 -3' -cf work/compiled.tar.zst "${files[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: compiled-${{ matrix.target }}
          path: work/compiled.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  bolt:
    needs: [resolve, compile, bolt-tool]
    if: inputs.generate_release_profiles
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.bolt_matrix) }}
    runs-on: ${{ matrix.builder == 'aarch64' && vars.KERNEL_AARCH64_BOLT_RUNNER || matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      UFLINUX_PKGREL: ${{ github.run_number }}
      UFLINUX_KERNEL_PACKAGES: work/kernel-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-inputs
          path: work
      - name: Install emulators
        run: scripts/install-emulators.sh "$TARGET"
      - uses: actions/download-artifact@v8
        with:
          name: alpine-build-deps-${{ matrix.builder }}
          path: work/kernel-packages
      - uses: actions/download-artifact@v8
        if: matrix.builder == 'x86_64'
        with:
          name: bolt-tool-x86
          path: work
      - uses: actions/download-artifact@v8
        with:
          name: compiled-${{ matrix.target }}
          path: work
      - name: Install QEMU plugin build tools
        run: sudo apt-get install -y --no-install-recommends gcc pkg-config libglib2.0-dev
      - name: Profile and rewrite the exact kernel ELF
        run: |
          output="work/$TARGET"
          mkdir -p "$output"
          time tar --same-permissions -xf work/compiled.tar.zst -C "$output"
          if [[ "$TARGET" == *x86_64 ]]; then
            tar -xf work/bolt-tool.tar -C "$output"
          else
            command -v llvm-bolt
            UFLINUX_BOLT_BINARY="$(command -v llvm-bolt)" scripts/prepare-bolt.sh "$TARGET" "$output" --bundle
          fi
          UFLINUX_KERNEL_PHASE=package UFLINUX_PROFILE_GUEST=1 \
            scripts/container.sh "$TARGET" work/resolved.json "$output"
          # The bundled launcher and optimizer are also mounted in the build container.
          time scripts/collect-release-profiles.sh work/resolved.json "$output/profiles" \
            "$TARGET" bolt "$output" "$PWD/$output/bolt/llvm-bolt"
          time env UFLINUX_KERNEL_PHASE=compile scripts/container.sh "$TARGET" work/resolved.json "$output" --apply-collected-bolt
          jq -e '.pgo and .bolt' "$output/build.json"
          time tar -C "$output" -I 'zstd -T2 -3' -cf work/rewritten.tar.zst \
            stage kernel.config build.json "source-$TARGET.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: rewritten-${{ matrix.target }}
          path: work/rewritten.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: bolt-profile-${{ matrix.target }}
          path: |
            work/${{ matrix.target }}/profiles/bolt.json
            work/${{ matrix.target }}/profiles/kernel.fdata
          if-no-files-found: error
          overwrite: true

  build:
    needs: [resolve, compile, bolt]
    if: ${{ !cancelled() && needs.compile.result == 'success' && (needs.bolt.result == 'success' || (!inputs.generate_release_profiles && needs.bolt.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      PROFILE_TARGET: ${{ inputs.profile_target || 'none' }}
      UFLINUX_PKGREL: ${{ github.run_number }}
      BOLT_RELEASE: ${{ matrix.profile && inputs.generate_release_profiles && (matrix.builder == 'x86_64' || vars.KERNEL_AARCH64_BOLT_RUNNER != '') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-inputs
          path: work
      - name: Install emulators
        run: scripts/install-emulators.sh "$TARGET"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.BOLT_RELEASE == 'true' && 'rewritten' || 'compiled' }}-${{ matrix.target }}
          path: work
      - name: Package and install-test kernel
        run: |
          mkdir -p "work/$TARGET"
          archive=compiled
          [[ "$BOLT_RELEASE" != true ]] || archive=rewritten
          time tar -xf "work/$archive.tar.zst" -C "work/$TARGET"
          time env UFLINUX_KERNEL_PHASE=package scripts/container.sh "$TARGET" work/resolved.json "work/$TARGET"
      - name: Boot-test packaged kernel
        run: time scripts/boot-test.sh "$TARGET" "work/$TARGET"
      - name: Collect release files
        run: |
          mkdir -p dist
          cp work/"$TARGET"/*.apk work/"$TARGET"/source-*.tar.zst dist/
          cp work/"$TARGET"/build.json "dist/build-$TARGET.json"
          case "$TARGET" in
            x86_64|aarch64|orangepi-rv2)
              arch=$(jq -r --arg target "$TARGET" '.[$target].apk' targets.json)
              cp work/"$TARGET"/apk-zstd "dist/apk-zstd-$arch"
              ;;
          esac
          if [[ "$TARGET" == x86_64 ]]; then
            cp work/"$TARGET"/source-apk-zstd.tar.gz dist/
          fi
          if [[ "$PROFILE_TARGET" != none ]]; then
            zstd -T2 "work/$TARGET/vmlinux" -o "dist/vmlinux-$TARGET.zst"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: inputs.profile_target == 'none' || inputs.profile_target == ''
        with:
          name: install-${{ matrix.target }}
          path: |
            work/${{ matrix.target }}/*.apk
            work/${{ matrix.target }}/*.ec.pem.pub
            work/${{ matrix.target }}/apk-zstd
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            work/${{ matrix.target }}/kernel.config
            work/${{ matrix.target }}/boot-test.log
          overwrite: true

  coexist:
    needs: [resolve, build]
    if: inputs.profile_target == 'none' || inputs.profile_target == ''
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: resolved-inputs
          path: work
      - uses: actions/download-artifact@v8
        with:
          name: install-${{ matrix.arch }}
          path: work/generic
      - uses: actions/download-artifact@v8
        with:
          name: install-virt-${{ matrix.arch }}
          path: work/virt
      - name: Install generic and guest kernels together
        run: |
          source scripts/container.sh
          image=$(alpine_image work/resolved.json "$TARGET_ARCH")
          series=$(jq -r '.alpine.x86_64.series' work/resolved.json)
          docker run --rm -v "$PWD/work:/work:ro" -v "$PWD/scripts:/scripts:ro" "$image" sh -ec '
            printf "https://dl-cdn.alpinelinux.org/alpine/%s/main\n" "$1" >/etc/apk/repositories
            . /scripts/guest-root.sh
            install_guest_root "$2"
            for flavor in generic virt; do
              apk_file=$(find "/work/$flavor" -name "*.apk" -type f)
              key_name=$(ls "/work/$flavor/"*.ec.pem.pub)
              cp "$key_name" "/guest/etc/apk/keys/${key_name##*/}"
              cp "$apk_file" "/guest/$flavor.apk"
            done
            cp /work/generic/apk-zstd /guest/tmp/apk-zstd
            chmod +x /guest/tmp/apk-zstd
            chroot /guest /tmp/apk-zstd add /generic.apk /virt.apk
            for flavor in "$2" "virt-$2"; do
              test -s "/guest/boot/vmlinuz-uflinux-$flavor"
              test -s "/guest/boot/initramfs-uflinux-$flavor"
            done
          ' sh "$series" "$TARGET_ARCH"

  publish:
    needs: [resolve, build, coexist]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.coexist.result == 'success' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && (inputs.profile_target == 'none' || inputs.profile_target == '') }}
    runs-on: ubuntu-26.04
    concurrency:
      group: kernels-publish-${{ needs.resolve.outputs.fingerprint }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
      GENERATED_PROFILES: ${{ inputs.generate_release_profiles }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: kernel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: resolved-inputs
          path: work
      - uses: actions/download-artifact@v8
        if: inputs.generate_release_profiles
        with:
          pattern: "*-profile-*"
          path: work/release-profiles
      - name: Check release assets
        run: |
          shopt -s nullglob
          for target in $(jq -r 'keys[]' targets.json); do
            files=(dist/linux-uflinux-"$target"-[0-9]*.apk)
            [[ ${#files[@]} == 1 ]]
            test -s "dist/build-$target.json"
            test -s "dist/source-$target.tar.zst"
          done
          for arch in x86_64 aarch64 riscv64; do
            test -s "dist/apk-zstd-$arch"
          done
          test -s dist/source-apk-zstd.tar.gz
          cp work/resolved.json dist/
          if [[ "$GENERATED_PROFILES" == true ]]; then
            PROFILE_FINGERPRINT=$(cd work/release-profiles && sha256sum -- */*.json */kernel.* | sha256sum | cut -d' ' -f1)
            FINGERPRINT=$(printf '%s\n%s\n' "$FINGERPRINT" "$PROFILE_FINGERPRINT" | sha256sum | cut -d' ' -f1)
            printf 'FINGERPRINT=%s\n' "$FINGERPRINT" >> "$GITHUB_ENV"
          fi
          printf '%s\n' "$FINGERPRINT" > dist/input-fingerprint.txt
          source scripts/container.sh
          alpine_image work/resolved.json x86_64 > work/signing-image
      - name: Build Zstandard-enabled signing tool
        run: |
          series=$(jq -r '.alpine.x86_64.series' work/resolved.json)
          aports_ref=$(jq -er .aports work/resolved.json)
          docker run --rm -v "$PWD/scripts:/scripts:ro" -v "$PWD/work:/work" \
            "$(cat work/signing-image)" sh -ec '
              printf "https://dl-cdn.alpinelinux.org/alpine/%s/main\n" "$1" >/etc/apk/repositories
              sh /scripts/build-apk-zstd.sh "$2" "$1" /work/signing-tools
            ' sh "$series" "$aports_ref"
      - name: Sign and verify APKs
        env:
          UFLINUX_APK_SIGNING_KEY: ${{ secrets.UFLINUX_APK_SIGNING_KEY }}
        run: |
          series=$(jq -r '.alpine.x86_64.series' work/resolved.json)
          docker run --rm -e UFLINUX_APK_SIGNING_KEY -v "$PWD/dist:/dist" \
            -v "$PWD/work/signing-tools/apk-zstd:/apk-zstd:ro" \
            -v "$PWD/scripts/sign.py:/sign.py:ro" "$(cat work/signing-image)" sh -ec '
              printf "https://dl-cdn.alpinelinux.org/alpine/%s/main\n" "$1" >/etc/apk/repositories
              apk add --no-progress openssl python3
              UFLINUX_APK=/apk-zstd python3 /sign.py /dist
            ' sh "$series"
      - name: Publish complete release
        run: |
          tag="kernels-${FINGERPRINT:0:24}"
          if state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$state" == false ]]; then exit 0; fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "UFlinux kernels ${FINGERPRINT:0:12}" \
              --notes "Signed Alpine kernel APKs. See the build manifests and SHA256SUMS."
          fi
          expected=$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          existing=$(gh release view "$tag" --json assets --jq '.assets[].name')
          while IFS= read -r asset; do
            if [[ -n "$asset" && ! -f "dist/$asset" ]]; then
              gh release delete-asset "$tag" "$asset" --yes
            fi
          done <<< "$existing"
          gh release upload "$tag" dist/* --clobber
          actual=$(gh release view "$tag" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The uploaded release assets differ from the local release files"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          gh release edit "$tag" --draft=false
